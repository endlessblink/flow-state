name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Fork-safe: pull_request trigger has NO access to secrets.
# Doppler secrets are NOT fetched here — ci.yml must build without them.
# Secret-dependent work (deploy, release) lives in deploy.yml / release.yml
# which only run on push to master or version tags (maintainer-only paths).
#
# NEVER add pull_request_target trigger here — it would expose secrets to fork PRs.

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint check — BLOCKING (0 errors baseline achieved Dec 18, 2025)
      - name: Lint check
        run: npm run lint

      # Type check — catches TypeScript errors without a full build
      - name: Type check
        run: npm run type-check

      # Build without secrets — uses .env.example / safe defaults
      # Real VITE_ vars come from Doppler at deploy time, not during CI
      - name: Build application
        run: npm run build

      # Unit tests (enabled after TASK-020 fix, Dec 19, 2025)
      - name: Run safety tests
        run: npx vitest run tests/safety/ --config vitest.ci.config.ts

      # Backup system integrity tests (TASK-338)
      - name: Verify backup system
        run: npm run test:backup
        continue-on-error: false

      - name: Verify restore capability
        run: npm run test:restore
        continue-on-error: false

  # TASK-1871: Behavioral canvas/sync regression gate. Boots a real local Supabase
  # and runs the two-INDEPENDENT-client Realtime harness (R1–R7) + the canvas/sync
  # unit suites — the layer that catches the recurring multi-client races
  # (all-nodes-shift, live-sync, legacy-group migration, dangling parent) that the
  # static safety tests cannot. This is what turns "fixed" into "stays fixed".
  canvas-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Canvas/sync UNIT suites (no DB needed) — geometry invariants, sync orchestrator,
      # realtime resilience, legacy-group migration, write-rate guard, auth-backup replay.
      - name: Canvas/sync unit tests
        run: npx vitest run tests/unit/canvas/ tests/unit/sync/ tests/unit/before-unload-electron.test.ts tests/unit/auth-backup-replayable.test.ts

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI (local dev dependency)
        run: echo "Using npx supabase from dev dependencies"

      - name: Boot Supabase + run two-client Realtime e2e (R1–R7)
        run: |
          npx supabase start
          ./scripts/run-e2e.sh canvas-sync-regressions.spec.ts --project=chromium --workers=2

      - name: Stop Supabase
        if: always()
        run: npx supabase stop || true
