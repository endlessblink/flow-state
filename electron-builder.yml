appId: com.flowstate.app
productName: FlowState
copyright: Copyright © 2026

directories:
  buildResources: src-tauri/icons
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  # TASK-1823: electron-updater's nested fs-extra can resolve these from the
  # app root. Keep the closure explicit so the main process cannot crash at
  # launch with "Cannot find module 'universalify'".
  - node_modules/universalify/**/*
  - node_modules/jsonfile/**/*
  - node_modules/graceful-fs/**/*
  - "!node_modules/better-sqlite3/**/*"
  - "!node_modules/node-gyp/**/*"

npmRebuild: false

extraMetadata:
  main: dist-electron/main.cjs

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: src-tauri/icons
  executableName: flowstate
  desktop:
    entry:
      StartupWMClass: flow-state

appImage:
  artifactName: FlowState-${version}-${arch}.AppImage

deb:
  artifactName: FlowState_${version}_${arch}.deb
  maintainer: endlessblink@gmail.com
  depends:
    - libnotify4
    - libxss1
    - libnss3

mac:
  target:
    - dmg
  icon: src-tauri/icons/icon.icns
  category: public.app-category.productivity

win:
  target:
    - nsis
  icon: src-tauri/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  url: https://in-theflow.com/updates/electron/
