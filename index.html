<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Set dark theme immediately to prevent FOUC
      document.documentElement.classList.add('dark-theme');
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#191715" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="FlowState — organize tasks across Board, Calendar, and Canvas views with built-in Pomodoro timer, AI assistant, and gamification. Web and desktop app." />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="FlowState — Visual Task Management & Focus Timer" />
    <meta property="og:description" content="Organize tasks across Board, Calendar, and Canvas views. Built-in Pomodoro timer, AI assistant, and gamification. Available as web app and desktop app." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlowState — Visual Task Management & Focus Timer" />
    <meta name="twitter:description" content="Organize tasks across Board, Calendar, and Canvas views. Built-in Pomodoro timer, AI assistant, and gamification." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <title>FlowState</title>
    <!-- BUG-1743: Critical CSS fallback — ensures dark theme even if CSS chunks fail to load offline -->
    <style>
      :root {
        --brand-primary: #E07A4B;
        --text-primary: #EDE6DC;
        --text-secondary: rgba(237, 230, 220, 0.62);
        --bg-primary: #191715;
        --bg-secondary: #24211E;
        --border-default: rgba(237, 230, 220, 0.08);
      }
      .dark-theme { background: #191715; color: #EDE6DC; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <!-- Warm Dark type: Clash Display (headings) + Inter (body) + Heebo/Rubik (Hebrew) + Noto emoji -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;700&family=Rubik:wght@600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  </head>
  <body style="background:#191715;margin:0;padding:0;">
    <div id="app">
      <style>
        #fs-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #191715;
          gap: 24px;
          font-family: system-ui, -apple-system, sans-serif;
        }
        #fs-logo-wrap {
          position: relative;
          width: 80px;
          height: 80px;
        }
        #fs-logo {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 48px;
          height: 48px;
          transform: translate(-50%, -50%);
          object-fit: contain;
          opacity: 0;
          animation: fs-fade 0.4s ease 0.1s forwards;
        }
        #fs-ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px solid rgba(224, 122, 75, 0.15);
          border-top-color: #E07A4B;
          animation: fs-spin 0.9s linear infinite;
        }
        #fs-label {
          color: rgba(237, 230, 220, 0.55);
          font-size: 13px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          opacity: 0;
          animation: fs-fade 0.5s ease 0.3s forwards;
        }
        @keyframes fs-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes fs-fade {
          to { opacity: 1; }
        }
      </style>
      <div id="fs-loader">
        <div id="fs-logo-wrap">
          <div id="fs-ring"></div>
          <img id="fs-logo" src="logo-glitch-tomato.png" alt="" />
        </div>
        <span id="fs-label">FlowState</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
