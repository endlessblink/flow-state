services:
  waha:
    image: devlikeapro/waha:latest
    ports:
      - "3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_DASHBOARD_ENABLED=true
      - WHATSAPP_HOOK_URL=http://bot:3001/webhook/waha
      - WHATSAPP_HOOK_EVENTS=message
    restart: unless-stopped

  bot:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    depends_on:
      - waha
    restart: unless-stopped
